extra_css:
  # The order matters: fonts and tokens first, then the syntax colours and the theme layer that
  # reference them.
  - css/triply-fonts.css
  - css/triply-tokens.css
  - css/triply-highlight.css
  - css/triply.css
extra_javascript:
  - js/triply.js
  - js/highlight.min.js
# This site is TriplyDB's documentation first: its pages sit at the top level, unlabelled, and
# TriplyETL is one entry beside them rather than a second heading of equal weight. Every entry with
# children below is a section, which the navigation panel renders as a branch that opens and closes
# (see `readthedocs-triply/nav.html`), so a product with a dozen pages under it costs one row until
# someone wants it.
nav:
  - Home: index.md
  - Getting started:
      - Overview: triply-db-getting-started/index.md
      - Uploading Data: triply-db-getting-started/uploading-data/index.md
      - Editing (SKOS) Data: triply-db-getting-started/editing-data/index.md
      - Sharing Data: triply-db-getting-started/publishing-data/index.md
      - Access Control: triply-db-getting-started/access-control/index.md
      - Viewing Data: triply-db-getting-started/viewing-data/index.md
      - Exporting Data: triply-db-getting-started/exporting-data/index.md
      - Saved Queries: triply-db-getting-started/saved-queries/index.md
      - Data Stories: triply-db-getting-started/data-stories/index.md
      - Admin Settings Pages: triply-db-getting-started/admin-settings-pages/index.md
      - Reference: triply-db-getting-started/reference/index.md
  - API: triply-api/index.md
  - TriplyDB-JS: https://static.triply.cc/triplydb-js/
  - Command-line Interface: https://static.triply.cc/cli/
  - Changelog: triplydb-changelog/index.md
  - TriplyETL:
      - Generic:
          - Overview: triply-etl/index.md
          - Getting Started: triply-etl/generic/getting-started.md
          - Changelog: triply-etl/generic/changelog.md
          - Command Line Interface (CLI): triply-etl/generic/cli.md
          - Declarations: triply-etl/generic/declarations.md
          - Control Structures: triply-etl/generic/control-structures.md
          - Debug: triply-etl/generic/debug.md
          - Internal Store: triply-etl/generic/internal-store.md
          - Maintenance: triply-etl/generic/maintenance.md
          - Record: triply-etl/generic/record.md
          - Vocabularies: triply-etl/generic/vocabularies.md
      - Sources:
          - Overview: triply-etl/sources/index.md
          - APIs: triply-etl/sources/apis.md
          - Inline JSON: triply-etl/sources/inline-json.md
          - Inline Strings: triply-etl/sources/inline-strings.md
          - Local Files: triply-etl/sources/local-files.md
          - Online Files: triply-etl/sources/online-files.md
          - RML Sources: triply-etl/sources/rml.md
          - TriplyDB Assets: triply-etl/sources/triplydb-assets.md
          - TriplyDB Datasets: triply-etl/sources/triplydb-datasets.md
          - TriplyDB Queries: triply-etl/sources/triplydb-queries.md
      - Extract:
          - Overview: triply-etl/extract/index.md
          - CSV: triply-etl/extract/csv.md
          - JSON: triply-etl/extract/json.md
          - OAI-PMH: triply-etl/extract/oai-pmh.md
          - Postgres: triply-etl/extract/postgres.md
          - RDF: triply-etl/extract/rdf.md
          - Shapefile: triply-etl/extract/shapefile.md
          - TSV: triply-etl/extract/tsv.md
          - XLSX: triply-etl/extract/xlsx.md
          - XML: triply-etl/extract/xml.md
      - Transform:
          - Overview: triply-etl/transform/index.md
          - RATT: triply-etl/transform/ratt.md
          - RML: triply-etl/transform/rml.md
          - TypeScript: triply-etl/transform/typescript.md
          - XSLT: triply-etl/transform/xslt.md
      - Assert:
          - Overview: triply-etl/assert/index.md
          - JSON-LD: triply-etl/assert/json-ld.md
          - RATT:
              - RATT Terms: triply-etl/assert/ratt/terms.md
              - RATT Statements: triply-etl/assert/ratt/statements.md
          - RML: triply-etl/assert/rml.md
          - XSLT: triply-etl/assert/xslt.md
      - Enrich:
          - Overview: triply-etl/enrich/index.md
          - SHACL:
              - Overview: triply-etl/enrich/shacl/index.md
              - Triple Rules: triply-etl/enrich/shacl/triple-rules.md
              - SPARQL Rules: triply-etl/enrich/shacl/sparql-rules.md
          - SPARQL:
              - SPARQL Construct: triply-etl/enrich/sparql/construct.md
              - SPARQL Update: triply-etl/enrich/sparql/update.md
      - Validate:
          - Overview: triply-etl/validate/index.md
          - Graph Comparison: triply-etl/validate/graph-comparison.md
          - SHACL: triply-etl/validate/shacl.md
      - Publish: triply-etl/publish/index.md
markdown_extensions:
  - attr_list:
  - toc:
      permalink: True
      title: "On this page:"
plugins:
  - mermaid2
  - redirects:
      redirect_maps:
       #'triply-db-getting-started/admin-settings-pages/index.md': 'triply-db/admin-settings/index.md'
       #'triply-db-getting-started/data-stories/index.md': 'triply-db/data-stories/index.md'
       #'triply-db-getting-started/exporting-data/index.md': 'triply-db/exporting-data/index.md'
       #'triply-db-getting-started/index.md': 'triply-db/index.md'
       #'triply-db-getting-started/publishing-data/index.md': 'triply-db/exposing-data/index.md'
       #'triply-db-getting-started/reference/index.md': 'triply-db/reference/index.md'
       #'triply-db-getting-started/saved-queries/index.md': 'triply-db/saved-queries/index.md'
       #'triply-db-getting-started/uploading-data/index.md': 'triply-db/adding-data/index.md'
       #'triply-db-getting-started/viewing-data/index.md': 'triply-db/viewing-data/index.md'
       # The TriplyDB.js documentation is generated from the source of `@triply/triplydb` and
       # published to static.triply.cc, so it cannot drift from the released package. Nothing is
       # written about the library here any more, and the navigation links straight out to it;
       # these keep every URL this site ever had for it working, the landing page included --
       # the console links to that one by name.
        'triplydb-js/index.md': 'https://static.triply.cc/triplydb-js/'
        'triplydb-js/faq/index.md': 'https://static.triply.cc/triplydb-js/'
        'triplydb-js/app/index.md': 'https://static.triply.cc/triplydb-js/classes/App.html'
        'triplydb-js/account/index.md': 'https://static.triply.cc/triplydb-js/interfaces/AccountBase.html'
        'triplydb-js/asset/index.md': 'https://static.triply.cc/triplydb-js/classes/Asset.html'
        'triplydb-js/dataset/index.md': 'https://static.triply.cc/triplydb-js/classes/Dataset.html'
        'triplydb-js/graph/index.md': 'https://static.triply.cc/triplydb-js/classes/Graph.html'
        'triplydb-js/group/index.md': 'https://static.triply.cc/triplydb-js/classes/Group.html'
        'triplydb-js/organization/index.md': 'https://static.triply.cc/triplydb-js/classes/Group.html'
        'triplydb-js/query/index.md': 'https://static.triply.cc/triplydb-js/classes/Query.html'
        'triplydb-js/service/index.md': 'https://static.triply.cc/triplydb-js/classes/Service.html'
        'triplydb-js/story/index.md': 'https://static.triply.cc/triplydb-js/classes/Story.html'
        'triplydb-js/user/index.md': 'https://static.triply.cc/triplydb-js/classes/User.html'
        'triply-cli/index.md': 'https://static.triply.cc/cli/'
        'triply-etl/assert/ratt/statement/index.md': 'triply-etl/assert/ratt/statements.md'
        'triply-etl/assert/ratt/term/index.md': 'triply-etl/assert/ratt/terms.md'
        'triply-etl/changelog/index.md': 'triply-etl/generic/changelog.md'
        'triply-etl/cli/index.md': 'triply-etl/generic/cli.md'
        'triply-etl/control/index.md': 'triply-etl/generic/control-structures.md'
        'triply-etl/debug/index.md': 'triply-etl/generic/debug.md'
        'triply-etl/declare/index.md': 'triply-etl/generic/declarations.md'
        'triply-etl/enrich/sparql/index.md': 'triply-etl/enrich/sparql/construct.md'
        'triply-etl/extract/formats/index.md': 'triply-etl/extract/index.md'
        'triply-etl/extract/record/index.md': 'triply-etl/generic/record.md'
        'triply-etl/extract/types/index.md': 'triply-etl/sources/index.md'
        'triply-etl/getting-started/index.md': 'triply-etl/generic/getting-started.md'
        'triply-etl/maintenance/index.md': 'triply-etl/generic/maintenance.md'
        'triply-etl/rml.md': 'triply-etl/transform/rml.md'
        'triply-etl/xslt.md': 'triply-etl/transform/xslt.md'
  - search
site_description: "The official documentation for the Triply products: TriplyDB, TriplyDB.js, and TriplyETL."
site_name: Triply Documentation
theme:
  custom_dir: readthedocs-triply/
  highlightjs: false
  locale: en
  logo: assets/triply-logo.svg
  name: readthedocs
  # The navigation panel lists pages, not the headings inside them: every page renders its own
  # headings from `[TOC]`, as the "On this page" panel beside the content.
  titles_only: true

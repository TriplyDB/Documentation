name: Publish Triply Documentation preview
on:
  push:
    branches:
      - next

# The publish step commits to the gh-pages branch.
permissions:
  contents: write

# The master and next workflows both write to gh-pages. Queue them rather than
# letting one push land on top of a tree the other is still building on.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    name: Deploy preview docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout next
        uses: actions/checkout@v4
        with:
          # The publish step commits on top of the existing gh-pages branch, so it needs the history.
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build preview site
        # No site_url is configured, so every generated link is relative and the same build
        # serves correctly from the /next/ prefix without any config change.
        run: |
          mkdocs build --strict
          # The custom domain belongs to the root site only; a CNAME under next/ is meaningless.
          rm -f site/CNAME
          # docs/robots.txt on master keeps crawlers out of /next/, but a robots.txt inside a
          # subdirectory is ignored, so mark the pages themselves as well.
          find site -name '*.html' -exec \
            sed -i 's|<head>|<head><meta name="robots" content="noindex,nofollow">|' {} +

      - name: Publish to gh-pages:/next
        # Touches next/ only. Everything else on gh-pages belongs to master
        # (see .github/workflows/main.yml).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add -B gh-pages ../gh-pages origin/gh-pages
          rm -rf ../gh-pages/next
          mkdir -p ../gh-pages/next
          cp -a site/. ../gh-pages/next/
          git -C ../gh-pages add -A
          git -C ../gh-pages diff --quiet --cached || \
            git -C ../gh-pages commit -m "Deployed ${GITHUB_SHA} from next"
          git -C ../gh-pages push origin gh-pages
